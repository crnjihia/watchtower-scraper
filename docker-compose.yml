version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: angalia_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  worker:
    build: .
    container_name: angalia_worker
    restart: unless-stopped
    depends_on:
      - redis
    env_file:
      - .env.example
    command: celery -A angalia.celery_app.celery_app worker --loglevel=info
    volumes:
      - ./data:/app/data

  beat:
    build: .
    container_name: angalia_beat
    restart: unless-stopped
    depends_on:
      - redis
    env_file:
      - .env.example
    command: celery -A angalia.celery_app.celery_app beat --loglevel=info
    volumes:
      - ./data:/app/data

volumes:
  redis_data:
