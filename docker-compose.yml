services:
  redis:
    image: redis:7-alpine
    container_name: watchtower_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: watchtower_worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.example
    environment:
      - DATABASE_URL=sqlite:////app/data/watchtower.db
      - REDIS_URL=redis://redis:6379/0
    command: ["celery", "-A", "watchtower.tasks.celery_app", "worker", "--loglevel=INFO"]
    volumes:
      - app_data:/app/data

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: watchtower_beat
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.example
    environment:
      - DATABASE_URL=sqlite:////app/data/watchtower.db
      - REDIS_URL=redis://redis:6379/0
    command: ["celery", "-A", "watchtower.tasks.celery_app", "beat", "--loglevel=INFO"]
    volumes:
      - app_data:/app/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: watchtower_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.example
    environment:
      - DATABASE_URL=sqlite:////app/data/watchtower.db
      - REDIS_URL=redis://redis:6379/0
      - HTTP_PORT=8000
    command: ["uvicorn", "watchtower.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  crawl:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.example
    environment:
      - DATABASE_URL=sqlite:////app/data/watchtower.db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - app_data:/app/data
    entrypoint: ["python", "-c", "import sys; from watchtower.tasks.crawl import run_spider; run_spider(sys.argv[1])"]

volumes:
  redis_data:
  app_data:
