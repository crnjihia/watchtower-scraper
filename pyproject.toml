[project]
name = "angalia-scraper"
version = "0.1.0"
description = "Scrapy‑based scraper for Kenyan job boards & e‑commerce sites."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Your Name", email = "you@example.com"}]

[project.urls]
Homepage = "https://github.com/yourorg/angalia-scraper"

[project.dependencies]
python = ">=3.11"
scrapy = "^2.11"
scrapy-rotating-proxies = "^0.6.2"
scrapy-user-agents = "^0.1.1"
SQLAlchemy = "^2.0"
alembic = "^1.13"
celery = "^5.4"
redis = "^5.0"
python-telegram-bot = {extras = ["async"], version = "^21.2"}
sendgrid = "^6.11"
structlog = "^24.1"
Jinja2 = "^3.1"
PyYAML = "^6.0"
httpx = "^0.27"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
    "black>=24.2",
    "isort>=5.13",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"
