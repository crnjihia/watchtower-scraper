[project]
name = "watchtower-scraper"
version = "0.1.0"
description = "Production-grade monitoring and scraping system for Kenyan job boards and e-commerce platforms."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Watchtower Scraper Team", email = "dev@watchtower.io"}]
dependencies = [
    "scrapy>=2.11.0",
    "SQLAlchemy>=2.0.0",
    "celery>=5.4.0",
    "redis>=5.0.0",
    "python-telegram-bot>=21.0",
    "sendgrid>=6.11.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "structlog>=24.1.0",
    "httpx>=0.27.0",
    "python-dateutil>=2.8.2",
]

[project.urls]
Homepage = "https://github.com/crnjihia/watchtower-scraper"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "responses>=0.25",
    "vcrpy>=6.0.0",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["watchtower*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::ResourceWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
