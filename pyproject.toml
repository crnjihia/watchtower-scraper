[project]
name = "watchtower-scraper"
version = "0.1.0"
description = "Ethical Scrapy-based scraper for Kenyan job boards and e-commerce sites."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Watchtower Team", email = "dev@watchtower.io"}]

[project.urls]
Homepage = "https://github.com/yourorg/watchtower-scraper"

dependencies = [
    "scrapy>=2.11.0",
    "scrapy-rotating-proxies>=0.6.2",
    "scrapy-user-agents>=0.1.1",
    "SQLAlchemy>=2.0.0",
    "celery>=5.4.0",
    "redis>=5.0.0",
    "python-telegram-bot>=21.2",
    "sendgrid>=6.11.0",
    "structlog>=24.1.0",
    "Jinja2>=3.1.0",
    "PyYAML>=6.0.0",
    "httpx>=0.27.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
    "pytest-mock>=3.12",
    "pytest-asyncio>=0.23",
    "black>=24.2",
    "isort>=5.13",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"


